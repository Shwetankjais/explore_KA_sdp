<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Destinations | Explore Karnataka</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Mukta:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body data-page="places">
    <div id="nav"></div>
    <header class="page-head">
      <div class="container">
        <h1>Destinations</h1>
        <p>Twelve places to start your Karnataka story.</p>
      </div>
    </header>
    <div class="motif"></div>
    <main class="container py-4">
      <div class="row g-3 mb-3">
        <div class="col-lg-5">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span
            ><input
              id="search"
              class="form-control"
              placeholder="Search Karnataka destinations..."
            />
          </div>
        </div>
        <div class="col-lg-7 d-flex flex-wrap gap-2" id="filters"></div>
      </div>
      <div class="row g-4" id="placeList"></div>
      <p id="none" class="text-center text-muted d-none py-5">
        No destinations match. Try another word or category.
      </p>
      <div class="mt-5" id="tripSection">
        <h2>My Trip</h2>
        <div id="tripBox"></div>
      </div>
    </main>
    <div id="foot"></div>
    <div id="modals"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
