<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gallery | Explore Karnataka</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Mukta:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body data-page="gallery">
    <div id="nav"></div>
    <header class="page-head">
      <div class="container">
        <h1>Gallery</h1>
        <p>Tap any photo to view it larger.</p>
      </div>
    </header>
    <div class="motif"></div>
    <main class="container py-4">
      <div class="d-flex flex-wrap gap-2 mb-3" id="gFilters"></div>
      <div class="masonry" id="gallery"></div>
    </main>
    <div id="foot"></div>
    <div id="modals"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
